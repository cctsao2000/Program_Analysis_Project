# Draft Tai-e taint configuration for the 4 CWE categories under study:
#   CWE-89  SQL injection        (sinks: java.sql + Spring JdbcTemplate)
#   CWE-79  Cross-site scripting (sinks: PrintWriter / servlet output)
#   CWE-22  Path traversal       (sinks: java.io / java.nio.file)
#   CWE-78  Command injection    (sinks: Runtime.exec / ProcessBuilder)
#
# STATUS (2026-11-18): entry-point strategy, servlet-interface sources
# and SQL sinks RESOLVED from Tai-e's own sources (see PILOT.md for the
# evidence trail); NOT YET RUN against OWASP BenchmarkJava -- the
# 8-case pilot in PILOT.md is the validation step, run on a machine
# with direct internet access.
#
# call-site-mode: true is load-bearing. The servlet entry-point plugin
# (src/BenchmarkEntryPointPlugin.java) supplies mock objects of
# interface type for HttpServletRequest/Response, on which Tai-e's
# virtual dispatch finds no concrete callee (ClassHierarchyImpl.
# lookupMethod skips abstract methods). In call-site mode, sources,
# sinks and transfers fire from the method reference at the call site
# in a reachable method, so no resolved call edge is needed
# (SourceHandler / SinkHandler / TransferHandler, Tai-e commit
# 407994d). Without this flag the servlet runs would report zero flows.
call-site-mode: true

# Design note: sanitizers are deliberately NOT configured here. The
# baseline is meant to over-approximate; recognising sanitizers
# (e.g. ESAPI encoding, PreparedStatement binding) is the LLM
# adjudicator's job, and the comparison measures how well it does it.
# An extension experiment may add verified sanitizer entries and
# re-run Tai-e (see prompts/adjudicate.md and README.md).

