  # KNOWN GAP (2026-11-18, measured on the 240-case sample): sources
  # whose value is extracted through an array or a Map do NOT
  # propagate taint in this configuration, because the source call
  # itself is unresolved (interface-typed mock receiver) so the
  # result variable never holds a real array/Map object for the
  # ARRAY-kind source / Map.get transfer to attach taint to. Affected
  # shapes: getParameterValues()[0] and getParameterMap().get()[0]
  # (32 of 120 sampled vulnerable cases use only these shapes; the
  # other 88 use getParameter/getHeader/getCookies or the
  # SeparateClassRequest helper, which DO work). getParameterNames()
  # IS covered via the Enumeration.nextElement() transfer below.
  # Candidate fix for the pilot's second round: a concrete stub
  # HttpServletRequest whose getParameterValues() returns a real
  # String[1] and whose getParameterMap() returns a pre-loaded Map;
  # see PILOT.md. Do not silently count these cases as true
  # negatives in the pilot -- they are a known baseline blind spot.

