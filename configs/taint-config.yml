  # --- CWE-89 SQL injection, plain JDBC (RESOLVED 2026-11-18).
  # --- Tai-e's bundled configs have no java.sql sinks (only Android
  # --- SQLite, Spring templates and Turbine), so these were built
  # --- from the JDK 8 java.sql API and validated against actual
  # --- BenchmarkJava usage in the 60 sampled CWE-89 cases (see
  # --- PILOT.md for counts). Every entry takes the SQL string as
  # --- argument 0.
  # ---
  # --- DESIGN DECISION (record for the report): the sink for
  # --- PreparedStatement/CallableStatement is the PREPARE call
  # --- (Connection.prepareStatement/prepareCall with a tainted SQL
  # --- string), NOT the no-arg executeQuery()/executeUpdate()/
  # --- execute() on the prepared statement -- those take no string,
  # --- so they are deliberately NOT listed. The safe cases in the
  # --- benchmark use prepareStatement with a constant SQL string
  # --- plus setString() bindings, so no taint reaches the prepare
  # --- call and no flow is reported; the vulnerable cases
  # --- concatenate user input into the SQL string before preparing
  # --- it, so the flow is caught at the prepare call. The
  # --- distinction is therefore carried by taint on the SQL argument,
  # --- not by method choice.
  # --- java.sql.Statement, String-taking execute family:
  - { method: "<java.sql.Statement: java.sql.ResultSet executeQuery(java.lang.String)>", index: 0 }
  - { method: "<java.sql.Statement: boolean execute(java.lang.String)>", index: 0 }
  - { method: "<java.sql.Statement: boolean execute(java.lang.String,int)>", index: 0 }
  - { method: "<java.sql.Statement: boolean execute(java.lang.String,int[])>", index: 0 }
  - { method: "<java.sql.Statement: boolean execute(java.lang.String,java.lang.String[])>", index: 0 }
  - { method: "<java.sql.Statement: int executeUpdate(java.lang.String)>", index: 0 }
  - { method: "<java.sql.Statement: int executeUpdate(java.lang.String,int)>", index: 0 }
  - { method: "<java.sql.Statement: int executeUpdate(java.lang.String,int[])>", index: 0 }
  - { method: "<java.sql.Statement: int executeUpdate(java.lang.String,java.lang.String[])>", index: 0 }
